    <script>
      // Environment Constraint: "HMR: Disabled. Ignore WebSocket errors."
      (function() {
        if (typeof window === 'undefined') return;

        // Suppress unhandled rejection or error from Vite's WebSocket module transport in AI Studio
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = reason ? (reason.message || String(reason)) : '';
          var stack = reason ? (reason.stack || '') : '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            stack.indexOf('@vite/client') !== -1 ||
            stack.indexOf('createWebSocketModuleRunnerTransport') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          var file = event.filename || '';
          var stack = (event.error && event.error.stack) || '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            file.indexOf('@vite/client') !== -1 ||
            stack.indexOf('createWebSocketModuleRunnerTransport') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // Safe mock for Vite HMR WebSocket so @vite/client skips connection attempt
        var NativeWebSocket = window.WebSocket;
        if (!NativeWebSocket) return;

        function FakeHmrWebSocket(url, protocols) {
          var isHmr = true; // All WebSockets in this client SPA are Vite HMR transports
          if (isHmr) {
            var listeners = {};
            var fakeSocket = {
              binaryType: 'blob',
              bufferedAmount: 0,
              extensions: '',
              protocol: Array.isArray(protocols) ? (protocols[0] || 'vite-hmr') : (protocols || 'vite-hmr'),
              readyState: 1, // WebSocket.OPEN
              url: String(url || ''),
              CONNECTING: 0,
              OPEN: 1,
              CLOSING: 2,
              CLOSED: 3,
              onopen: null,
              onclose: null,
              onmessage: null,
              onerror: null,
              addEventListener: function(event, handler) {
                listeners[event] = listeners[event] || [];
                listeners[event].push(handler);
                if (event === 'open') {
                  setTimeout(function() {
                    try { handler({ type: 'open', target: fakeSocket }); } catch (_) {}
                  }, 0);
                }
              },
              removeEventListener: function(event, handler) {
                if (listeners[event]) {
                  listeners[event] = listeners[event].filter(function(h) { return h !== handler; });
                }
              },
              dispatchEvent: function() { return true; },
              send: function() {},
              close: function() {
                fakeSocket.readyState = 3;
                if (listeners['close']) {
                  listeners['close'].forEach(function(h) {
                    try { h({ code: 1000, reason: 'Normal closure', wasClean: true }); } catch (_) {}
                  });
                }
              }
            };

            setTimeout(function() {
              if (typeof fakeSocket.onopen === 'function') {
                try { fakeSocket.onopen({ type: 'open', target: fakeSocket }); } catch (_) {}
              }
            }, 0);

            return fakeSocket;
          }
          return new NativeWebSocket(url, protocols);
        }

        FakeHmrWebSocket.prototype = NativeWebSocket.prototype;
        FakeHmrWebSocket.CONNECTING = 0;
        FakeHmrWebSocket.OPEN = 1;
        FakeHmrWebSocket.CLOSING = 2;
        FakeHmrWebSocket.CLOSED = 3;
        window.WebSocket = FakeHmrWebSocket;
      })();
    </script>
    <title>Royal POS &amp; Enterprise ERP</title>
    <script>
      (function() {
        try {
          var storageKey = 'ultimate_erp_pos_database_v1';
          var saved = localStorage.getItem(storageKey + '_settings');
          var theme = 'dark'; // Default system theme is dark
          if (saved) {
            var parsed = JSON.parse(saved);
            if (parsed && parsed.themeMode) {
              theme = parsed.themeMode;
            }
          }
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          // Silent fallback to dark mode on error
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
